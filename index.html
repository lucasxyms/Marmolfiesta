<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sobre de Antonia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  /* Concepto: un sobre marfil sobre rosa palo. El sello de lacre se toca, la solapa se abre,
     la invitación sube, se muestra completa y debajo queda el menú. Un 67 escondido abajo a la derecha. */
  :root {
    --ground: #c99a9c;
    --ground-glow: #dcb1b1;
    --paper: #f6eee0;
    --paper-shade: #ead9c4;
    --paper-edge: #dcc8b0;
    --liner: #8d4b57;
    --liner-deep: #743b46;
    --seal: #8e2433;
    --seal-hi: #b83a4b;
    --ink: #4a1d27;
    --ink-soft: #6a3340;
    --font-script: "Pinyon Script", "Snell Roundhand", cursive;
    --font-sans: "Jost", "Helvetica Neue", Arial, sans-serif;
    --w: min(86vw, 430px);
    --h: calc(var(--w) * 0.68);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    background-image: radial-gradient(120% 80% at 50% 38%, var(--ground-glow) 0%, var(--ground) 72%);
    color: var(--ink);
    font-family: var(--font-sans);
    font-weight: 300;
    overflow-x: hidden;
  }
  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-inline: 16px;
    padding-block: 28px 36px;
  }

  .title { margin: 0 0 calc(var(--w) * 0.1); text-align: center; line-height: 1; font-weight: 300; }
  .title .script { font-family: var(--font-script); font-size: clamp(2.6rem, 11vw, 3.6rem); display: block; margin-bottom: -0.08em; color: var(--seal); }
  .title .name { font-size: clamp(.85rem, 3.6vw, 1.05rem); letter-spacing: 0.42em; padding-left: 0.42em; text-transform: uppercase; }

  .stage { position: relative; width: var(--w); height: var(--h); margin-top: calc(var(--w) * 0.62); }
  .shadow {
    position: absolute; left: 6%; right: 6%; bottom: -14px; height: 26px;
    background: radial-gradient(closest-side, rgba(74,29,39,.5), rgba(74,29,39,0));
    filter: blur(6px);
  }
  .mask {
    position: absolute; inset: 0;
    perspective: 1100px;
    clip-path: inset(-900px -60px 0 -60px);
  }
  .part { position: absolute; }

  .back { inset: 0; background: var(--liner); border-radius: 3px; z-index: 0; }

  .card {
    z-index: 3;
    left: 5%; width: 90%;
    top: calc(var(--w) * 0.05);
    background: #fdeceb;
    box-shadow: 0 2px 10px rgba(60,20,30,.28);
    transition: transform 1.1s cubic-bezier(.45,.05,.2,1) .55s;
  }
  .card img { display: block; width: 100%; height: auto; }

  .pocket { inset: 0; z-index: 4; pointer-events: none; filter: drop-shadow(0 -1px 2px rgba(60,20,30,.2)); }
  .pocket i { position: absolute; inset: 0; display: block; }
  .pocket .l { background: linear-gradient(100deg, var(--paper-shade), var(--paper)); clip-path: polygon(0 0, 50.4% 51%, 0 100%); }
  .pocket .r { background: linear-gradient(260deg, var(--paper-shade), var(--paper)); clip-path: polygon(100% 0, 49.6% 51%, 100% 100%); }
  .pocket .b { background: linear-gradient(0deg, var(--paper-edge), var(--paper) 78%); clip-path: polygon(0 100%, 50% 47.5%, 100% 100%); }

  .flap {
    left: 0; top: 0; width: 100%; height: 56%;
    transform-origin: 50% 0;
    transition: transform .85s cubic-bezier(.5,.05,.25,1), z-index 0s linear .42s;
    transform-style: preserve-3d;
    z-index: 6;
    filter: drop-shadow(0 3px 3px rgba(60,20,30,.25));
  }
  .flap .face {
    position: absolute; inset: 0;
    clip-path: polygon(-0.3% 0, 100.3% 0, 50% 100%);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .flap .out { background: linear-gradient(180deg, var(--paper) 0%, var(--paper-shade) 100%); }
  .flap .in { background: linear-gradient(0deg, var(--liner-deep), var(--liner)); transform: rotateX(180deg); }

  .seal {
    z-index: 7;
    left: 50%; top: 51%;
    width: clamp(54px, 15vw, 68px); aspect-ratio: 1;
    margin: calc(clamp(54px, 15vw, 68px) / -2) 0 0 calc(clamp(54px, 15vw, 68px) / -2);
    border: 0; padding: 0; cursor: pointer;
    border-radius: 50% 47% 52% 49% / 49% 52% 47% 50%;
    background: radial-gradient(circle at 34% 30%, var(--seal-hi), var(--seal) 58%, #5c1422 100%);
    box-shadow: 0 3px 8px rgba(40,10,20,.45), inset 0 0 0 3px rgba(0,0,0,.08), inset 0 2px 3px rgba(255,255,255,.22);
    color: #f3cfd2;
    font-family: var(--font-script); font-size: clamp(1.7rem, 6vw, 2.2rem); line-height: 1;
    display: grid; place-items: center;
    transition: transform .35s ease, opacity .35s ease;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .seal span { transform: translateY(-2px); text-shadow: 0 1px 1px rgba(0,0,0,.35); }
  .seal:hover { transform: scale(1.06); }
  .seal:focus-visible, .again:focus-visible, .menu-btn:focus-visible, .snd:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 3px 8px rgba(40,10,20,.45), inset 0 0 0 3px rgba(0,0,0,.08), inset 0 2px 3px rgba(255,255,255,.22), 0 0 0 0 rgba(142,36,51,.45); }
    55% { box-shadow: 0 3px 8px rgba(40,10,20,.45), inset 0 0 0 3px rgba(0,0,0,.08), inset 0 2px 3px rgba(255,255,255,.22), 0 0 0 16px rgba(142,36,51,0); }
  }

  .hint { margin: 30px 0 0; font-size: .78rem; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-soft); text-align: center; padding-left: .3em; transition: opacity .4s; }

  /* Estado: abierto */
  .open .flap { transform: rotateX(180deg); z-index: 1; }
  .open .seal { opacity: 0; transform: scale(.7) rotate(-12deg); pointer-events: none; animation: none; }
  .open .card { transform: translateY(calc(var(--w) * -0.76)); }
  .open ~ .hint { opacity: 0; }

  /* Vista completa: invitación y menú */
  .reveal {
    position: fixed; inset: 0; z-index: 20;
    background: var(--ground);
    background-image: radial-gradient(120% 80% at 50% 25%, var(--ground-glow) 0%, var(--ground) 72%);
    overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 16px 44px;
    opacity: 0; visibility: hidden;
    transition: opacity .8s ease, visibility 0s linear .8s;
  }
  .sheet { width: min(100%, 560px); margin-block: auto; display: flex; flex-direction: column; align-items: center; }
  .sheet img {
    display: block; width: 100%; height: auto;
    box-shadow: 0 18px 50px rgba(60,20,30,.4);
  }
  .sheet .inv { transform: translateY(24px) scale(.94); transition: transform 1s cubic-bezier(.2,.7,.2,1); }
  .showing .reveal { opacity: 1; visibility: visible; transition: opacity .8s ease, visibility 0s; }
  .showing .sheet .inv { transform: none; }
  .menu-btn, .again {
    flex: none;
    background: transparent; color: var(--ink);
    border: 1px solid rgba(74,29,39,.5);
    padding: 12px 26px; border-radius: 999px;
    font-family: var(--font-sans); font-weight: 400; font-size: .78rem; letter-spacing: .28em; text-transform: uppercase;
    cursor: pointer; transition: background .25s, border-color .25s;
  }
  .menu-btn { margin-block: 26px 40px; padding-left: calc(26px + .28em); }
  .again { margin-top: 30px; }
  .menu-btn:hover, .again:hover { background: rgba(74,29,39,.08); border-color: var(--ink); }
  .menu-label { margin: 0 0 16px; font-size: .78rem; letter-spacing: .34em; padding-left: .34em; text-transform: uppercase; color: var(--ink-soft); text-align: center; }

  .snd {
    position: fixed; z-index: 40;
    top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px;
    width: 42px; height: 42px; display: grid; place-items: center;
    border-radius: 50%; border: 1px solid rgba(74,29,39,.35);
    background: rgba(246,238,224,.55); color: var(--ink);
    cursor: pointer; padding: 0;
  }
  .snd:hover { background: rgba(246,238,224,.85); }
  .snd .x { display: none; }
  .snd[aria-pressed="false"] .w { display: none; }
  .snd[aria-pressed="false"] .x { display: inline; }


  .egg {
    position: fixed; z-index: 45; right: 0; bottom: 0; width: 34px; height: 34px;
    padding: 0; border: 0; background: transparent; opacity: 0; cursor: default;
    -webkit-tap-highlight-color: transparent;
  }
  .egg-num {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none;
    font-family: var(--font-sans); font-weight: 400; font-size: clamp(8rem, 42vw, 18rem); line-height: 1;
    color: var(--seal); -webkit-text-stroke: 3px #fff4dc; paint-order: stroke fill;
    text-shadow: 0 8px 30px rgba(60,20,30,.45);
    opacity: 0; visibility: hidden;
  }
  .egg-num.go { visibility: visible; animation: eggpop 1.9s ease both; }
  @keyframes eggpop {
    0% { opacity: 0; transform: scale(.4) rotate(-6deg); }
    12% { opacity: 1; transform: scale(1.15) rotate(3deg); }
    20% { transform: scale(1) rotate(-2deg); }
    28% { transform: translateX(-9px); }
    34% { transform: translateX(9px); }
    40% { transform: translateX(-6px); }
    46% { transform: translateX(6px); }
    52% { transform: none; }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05); }
  }
  @keyframes eggfade { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .seal { animation: none; }
    .card, .flap, .reveal, .sheet .inv { transition-duration: .01s; transition-delay: 0s; }
    .egg-num.go { animation-name: eggfade; }
  }
</style>

</head>

<button class="egg" id="egg" type="button" tabindex="-1" aria-hidden="true"></button>
<div class="egg-num" id="eggNum" aria-hidden="true">67</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var page = document.getElementById('page');
  var seal = document.getElementById('seal');
  var again = document.getElementById('again');
  var hint = document.getElementById('hint');
  var full = document.getElementById('fullImg');
  var reveal = document.getElementById('reveal');
  var sndBtn = document.getElementById('snd');
  var menuBtn = document.getElementById('menuBtn');
  var menuLabel = document.getElementById('menuLabel');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timers = [];
  var soundOn = true;

  full.src = document.getElementById('cardImg').src;

  /* ---------- Sonido (sintetizado, suave y de fondo) ---------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, master = null, noiseBuf = null;

  function audio() {
    if (!soundOn || !AC) return null;
    try {
      if (!ac) {
        ac = new AC();
        master = ac.createGain();
        master.gain.value = 0.5;
        master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }

  function noise(t0, dur, type, freq, q, peak, atk) {
    var s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    var f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t0); s.stop(t0 + dur + 0.05);
  }

  function rustle() {
    if (!audio()) return;
    var t = ac.currentTime;
    noise(t, 0.7, 'bandpass', 1600, 0.8, 0.07, 0.18);
  }

  function tone(freq, t0, dur, peak) {
    var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    lp.connect(g); g.connect(master);
    [[1, 'sine', 1, -3], [2, 'sine', 0.3, 2], [1, 'triangle', 0.18, 4]].forEach(function (p) {
      var o = ac.createOscillator(); o.type = p[1]; o.frequency.value = freq * p[0]; o.detune.value = p[3];
      var og = ac.createGain(); og.gain.value = p[2];
      o.connect(og); og.connect(lp);
      o.start(t0); o.stop(t0 + dur + 0.05);
    });
  }

  function chords() {
    if (!audio()) return;
    var t = ac.currentTime + 0.05;
    // Fmaj9 y luego G6/9: cálido, tipo piano eléctrico, sin arpegios de cuento
    tone(87.31, t, 2.4, 0.11);
    [174.61, 220, 261.63, 329.63, 392].forEach(function (f, i) { tone(f, t + i * 0.07, 2.2, 0.05); });
    var t2 = t + 1.15;
    tone(98, t2, 2.8, 0.1);
    [196, 246.94, 329.63, 440, 587.33].forEach(function (f, i) { tone(f, t2 + i * 0.07, 2.6, 0.045); });
  }

  function alertSound() {
    if (!audio()) return;
    var t = ac.currentTime + 0.02;
    [988, 740, 988, 740, 988].forEach(function (f, i) {
      var s = t + i * 0.17;
      var o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, s);
      g.gain.linearRampToValueAtTime(0.09, s + 0.01);
      g.gain.setValueAtTime(0.09, s + 0.11);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.15);
      o.connect(lp); lp.connect(g); g.connect(master);
      o.start(s); o.stop(s + 0.17);
    });
  }

  /* ---------- Flujo ---------- */
  function later(fn, ms) { timers.push(setTimeout(fn, reduce ? 0 : ms)); }
  function clear() { timers.forEach(clearTimeout); timers = []; }

  function openIt() {
    clear();
    audio();
    rustle();
    stage.classList.add('open');
    hint.style.opacity = '0';
    later(function () {
      page.classList.add('showing');
      reveal.scrollTop = 0;
      again.focus({ preventScroll: true });
      chords();
    }, 2300);
  }

  function closeIt() {
    clear();
    page.classList.remove('showing');
    later(function () { stage.classList.remove('open'); hint.style.opacity = ''; seal.focus({ preventScroll: true }); }, 900);
  }

  seal.addEventListener('click', openIt);
  again.addEventListener('click', closeIt);
  menuBtn.addEventListener('click', function () {
    menuLabel.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  });
  var egg = document.getElementById('egg');
  var eggNum = document.getElementById('eggNum');
  var eggTimer = 0;
  egg.addEventListener('click', function () {
    alertSound();
    try { if (navigator.vibrate) navigator.vibrate([90, 60, 90]); } catch (e) {}
    eggNum.classList.remove('go');
    void eggNum.offsetWidth;
    eggNum.classList.add('go');
    clearTimeout(eggTimer);
    eggTimer = setTimeout(function () { eggNum.classList.remove('go'); }, 1950);
  });
  sndBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    sndBtn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    if (soundOn) audio();
  });
})();
</script>
</body>
</html>
